name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            archive: scheduline-linux-x64.zip
          - os: windows-latest
            archive: scheduline-win-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build:prod
      - name: Archive build
        shell: bash
        run: |
          cd build
          case "$RUNNER_OS" in
            Linux)  zip -r "../${{ matrix.archive }}" . ;;
            Windows) 7z a -tzip "../${{ matrix.archive }}" . ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "scheduline-*.zip"
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: "scheduline-*.zip"
          generate_release_notes: true
